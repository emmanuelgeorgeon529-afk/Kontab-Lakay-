<!-- views/saas_localisation.html -->
<section id="saas" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">SaaS & Localisation</h2>
        <div style="display:flex; gap:8px;">
            <button onclick="openSaaSSettingsModal()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">🌍 Ajoute Lang</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">💱 Taux Deviz</button>
        </div>
    </div>

    <!-- 10.1 KPI SaaS -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">🌍 Lang aktive</div><div class="value" id="activeLanguages">0</div><div class="change up" id="langChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">💱 Deviz aktive</div><div class="value" id="activeCurrencies">0</div><div class="change up" id="currChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">🧮 Taks konfigire</div><div class="value" id="activeTaxes">0</div><div class="change up" id="taxChange">✅ Tout konfigire</div></div>
        <div class="kpi-card"><div class="label">🔌 API Entegrasyon</div><div class="value" id="activeApis">0</div><div class="change up" id="apiChange">↑ 0</div></div>
    </div>

    <!-- 10.1 Grafik: Repatrisyon deviz & Itilizasyon API -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">💱 Repatrisyon pa Deviz</h4></div>
            <div class="chart-container"><canvas id="saasCurrencyChart"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Itilizasyon API yo</h4></div>
            <div class="chart-container"><canvas id="saasApiChart"></canvas></div>
        </div>
    </div>

    <!-- Modal pou ajoute yon nouvo lang -->
    <div id="saasSettingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:white; padding:24px; border-radius:16px; max-width:400px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom:16px;">Ajoute yon Nouvo Lang</h3>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Kòd Lang (eg: 'ht', 'fr', 'en')</label>
                    <input type="text" id="newLangCode" placeholder="ht" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
                    <button onclick="closeSaaSSettingsModal()" style="padding:8px 16px; border:1px solid #E2E8F0; background:white; border-radius:6px; cursor:pointer;">Anile</button>
                    <button onclick="saveNewLanguage()" style="padding:8px 16px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Ajoute</button>
                </div>
            </div>
        </div>
    </div>
</section>
