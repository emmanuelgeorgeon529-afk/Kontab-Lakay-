<!-- views/ged_archivage.html -->
<section id="ged" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">GED & Archivage</h2>
        <div style="display:flex; gap:8px;">
            <button onclick="openGedModal()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📤 Nouvo Dokiman</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📊 Rapò Stockage</button>
        </div>
    </div>

    <!-- 8.1 KPI GED -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">📄 Total Dokiman</div><div class="value" id="totalDocuments">0</div><div class="change up" id="docChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">📤 An Atant Validasyon</div><div class="value" id="pendingDocs">0</div><div class="change down" id="pendChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">⚠️ Dokiman Ekspire</div><div class="value" id="expiredDocs">0</div><div class="change down" id="expChange">Aksyon nesesè</div></div>
        <div class="kpi-card"><div class="label">💾 Stockage Itilize</div><div class="value" id="storageUsed">0 GB</div><div class="change up" id="storageChange">↑ 0%</div></div>
    </div>

    <!-- 8.1 Grafik: Evolution dokiman & Kategori -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Evolisyon Dokiman</h4></div>
            <div class="chart-container"><canvas id="gedEvolutionChart"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📂 Repatrisyon pa Kategori</h4></div>
            <div class="chart-container"><canvas id="gedCategoryChart"></canvas></div>
        </div>
    </div>

    <!-- Modal pou telechaje dokiman -->
    <div id="newDocModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:white; padding:24px; border-radius:16px; max-width:400px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom:16px;">Nouvo Dokiman</h3>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Non Dokiman</label>
                    <input type="text" id="docName" placeholder="Egzanp: Kontrat Vente" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Kategori</label>
                    <select id="docCategory" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                        <option value="Contrats">Contrats</option>
                        <option value="Factures">Factures</option>
                        <option value="RH">RH</option>
                        <option value="Juridique">Juridique</option>
                        <option value="Lòt">Lòt</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Kantite (MB)</label>
                    <input type="number" id="docSize" placeholder="0" step="0.1" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
                    <button onclick="closeGedModal()" style="padding:8px 16px; border:1px solid #E2E8F0; background:white; border-radius:6px; cursor:pointer;">Anile</button>
                    <button onclick="saveNewDocument()" style="padding:8px 16px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Telechaje</button>
                </div>
            </div>
        </div>
    </div>
</section>
