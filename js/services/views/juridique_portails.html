<!-- views/juridique_portails.html -->
<section id="juridique" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">Juridique & Portails</h2>
        <div style="display:flex; gap:8px;">
            <button onclick="openContractModal()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📜 Nouvo Kontra</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">🌐 Pòtal Kliyan</button>
        </div>
    </div>

    <!-- 9.1 KPI Juridique -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">📜 Total Kontra</div><div class="value" id="totalContracts">0</div><div class="change up" id="contractChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">✅ Kontra Aktif</div><div class="value" id="activeContracts">0</div><div class="change up" id="activeContractChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">⚠️ Ekspire bientôt</div><div class="value" id="expiringContracts">0</div><div class="change down" id="expiringChange">Aksyon nesesè</div></div>
        <div class="kpi-card"><div class="label">🛡️ Asirans</div><div class="value" id="totalInsurance">0</div><div class="change up" id="insChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">🤝 Pòtal Kliyan</div><div class="value" id="clientPortalCount">0</div><div class="change up" id="clientPortalChange">↑ 0</div></div>
    </div>

    <!-- 9.1 Grafik: Evolution kontra & Repatrisyon pòtal -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Evolisyon Kontra</h4></div>
            <div class="chart-container"><canvas id="juridiqueChart1"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">🌐 Aksè Pòtal</h4></div>
            <div class="chart-container"><canvas id="juridiqueChart2"></canvas></div>
        </div>
    </div>

    <!-- Modal Nouvo Kontra -->
    <div id="newContractModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:white; padding:24px; border-radius:16px; max-width:400px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom:16px;">Nouvo Kontra</h3>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Non Kontra</label>
                    <input type="text" id="contractName" placeholder="Egzanp: Contrat SuperStore" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Kliyan / Founisè</label>
                    <input type="text" id="contractParty" placeholder="Non kliyan an" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Dat Ekspirasyon</label>
                    <input type="date" id="contractExpiry" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
                    <button onclick="closeContractModal()" style="padding:8px 16px; border:1px solid #E2E8F0; background:white; border-radius:6px; cursor:pointer;">Anile</button>
                    <button onclick="saveNewContract()" style="padding:8px 16px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Sove</button>
                </div>
            </div>
        </div>
    </div>
</section>
