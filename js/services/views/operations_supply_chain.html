<!-- views/operations_supply_chain.html -->
<section id="operations" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">Opérations & Supply Chain</h2>
        <div style="display:flex; gap:8px;">
            <!-- Bouton ki ap ouvri modal la -->
            <button onclick="openProductModal()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📦 Nouvo Pwodwi</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📊 Rapò Stock</button>
        </div>
    </div>

    <!-- 4.2 KPI Stock (Ak ID) -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">📦 Valè Inventory</div><div class="value" id="totalStockValue">0 HTG</div><div class="change up" id="stockChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">🏭 Total Pwodwi</div><div class="value" id="totalProductsCount">0</div><div class="change up" id="productChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">🚚 Founisè Aktif</div><div class="value" id="activeSuppliers">0</div><div class="change up" id="supplierChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">⚠️ Alertes Stock</div><div class="value" id="stockAlertsCount">0</div><div class="change down" id="alertChange">Aksyon nesesè</div></div>
    </div>

    <!-- 4.7 Grafik: Evolution Stock & Achats -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Évolution Stock</h4></div>
            <div class="chart-container"><canvas id="stockChartEvolution"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">🛒 Achats Mensuels</h4></div>
            <div class="chart-container"><canvas id="purchasesChart"></canvas></div>
        </div>
    </div>

    <!-- ===================== MODAL NOUVO PWODWI ===================== -->
    <div id="newProductModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:white; padding:24px; border-radius:16px; max-width:400px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom:16px;">Nouvo Pwodwi</h3>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Non Pwodwi</label>
                    <input type="text" id="prodName" placeholder="Egzanp: Kafe Gourmet" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">SKU / Barcode</label>
                    <input type="text" id="prodSku" placeholder="SKU-001" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Kategori</label>
                    <select id="prodCategory" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                        <option value="Elektronik">Elektronik</option>
                        <option value="Epis">Epis</option>
                        <option value="Mobil">Mobil</option>
                        <option value="Lòt">Lòt</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Pri Inite (HTG)</label>
                    <input type="number" id="prodPrice" placeholder="0" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Kantite Inisyal</label>
                    <input type="number" id="prodQty" placeholder="0" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
                    <button onclick="closeProductModal()" style="padding:8px 16px; border:1px solid #E2E8F0; background:white; border-radius:6px; cursor:pointer;">Anile</button>
                    <button onclick="saveNewProduct()" style="padding:8px 16px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Sove</button>
                </div>
            </div>
        </div>
    </div>
</section>
