<!-- views/rh_paie.html -->
<section id="rh" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">Ressources Humaines & Paie</h2>
        <div style="display:flex; gap:8px;">
            <button style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">➕ Nouvo Anplwaye</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📊 Rapò RH</button>
        </div>
    </div>

    <!-- 6.1 KPI RH (Ak ID) -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">👥 Total Anplwaye</div><div class="value" id="totalEmployees">0</div><div class="change up" id="empChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">🟢 Anplwaye Aktif</div><div class="value" id="activeEmployees">0</div><div class="change up" id="activeChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">🏖️ Anplwaye an Konje</div><div class="value" id="onLeaveEmployees">0</div><div class="change down" id="leaveChange">↓ 0</div></div>
        <div class="kpi-card"><div class="label">💵 Pewòl Mwa sa</div><div class="value" id="monthlyPayroll">0 HTG</div><div class="change up" id="payrollChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">⏰ Lè Siplemantè</div><div class="value" id="totalOvertime">0h</div><div class="change down" id="overTimeChange">↑ 0h</div></div>
    </div>

    <!-- 6.1 Grafik: Depans Salè & Distribisyon pa Depatman -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Depans Salè (6 mwa)</h4></div>
            <div class="chart-container"><canvas id="rhSalaryChart"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">👥 Distribisyon pa Depatman</h4></div>
            <div class="chart-container"><canvas id="rhDeptChart"></canvas></div>
        </div>
    </div>
</section>
