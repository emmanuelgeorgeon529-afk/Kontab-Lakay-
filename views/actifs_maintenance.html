<!-- views/actifs_maintenance.html -->
<section id="actifs" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">Actifs & Maintenance</h2>
        <div style="display:flex; gap:8px;">
            <button style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">➕ Nouvo Byen</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📊 Rapò Actifs</button>
        </div>
    </div>

    <!-- 7.1 KPI Actifs (Ak ID) -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">💰 Valè total</div><div class="value" id="totalAssetsValue">0 HTG</div><div class="change up" id="assetValueChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">📉 Amortisman akimile</div><div class="value" id="accumulatedDepreciation">0 HTG</div><div class="change down" id="deprChange">↓ 0%</div></div>
        <div class="kpi-card"><div class="label">📊 Valè nèt comptable</div><div class="value" id="netBookValue">0 HTG</div><div class="change up" id="netChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">🔧 Antretyen pwograme</div><div class="value" id="scheduledMaintenance">0</div><div class="change up" id="schedChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">⚠️ Antretyen an reta</div><div class="value" id="overdueMaintenance">0</div><div class="change down" id="overdueChange">Aksyon nesesè</div></div>
        <div class="kpi-card"><div class="label">🚚 Machin aktif</div><div class="value" id="activeVehiclesAssets">0</div><div class="change up" id="vehAssetChange">↑ 0</div></div>
    </div>

    <!-- 7.1 Grafik: Evolisyon valè byen & Depans antretyen -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Evolisyon valè byen</h4></div>
            <div class="chart-container"><canvas id="assetValueChart"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">🔧 Depans antretyen pa mwa</h4></div>
            <div class="chart-container"><canvas id="assetMaintenanceChart"></canvas></div>
        </div>
    </div>
</section>
