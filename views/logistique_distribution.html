<!-- views/logistique_distribution.html -->
<section id="logistique" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">Logistique & Transport</h2>
        <div style="display:flex; gap:8px;">
            <button style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">🚚 Nouvo Livrezon</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📊 Rapò Logistik</button>
        </div>
    </div>

    <!-- 5.1 KPI Logistik (Ak ID) -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">🚚 Livrezon an atant</div><div class="value" id="pendingDeliveries">0</div><div class="change down" id="pendingDelChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">📦 Livrezon jodi a</div><div class="value" id="todayDeliveries">0</div><div class="change up" id="todayDelChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">💰 Depans transpò (mwa)</div><div class="value" id="transportCost">0 HTG</div><div class="change down" id="costChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">🔄 Retou pwodwi</div><div class="value" id="returnsCount">0</div><div class="change down" id="returnsChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">⛽ Depans gaz</div><div class="value" id="fuelCost">0 HTG</div><div class="change up" id="fuelChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">🚛 Veyikil aktif</div><div class="value" id="activeVehicles">0</div><div class="change up" id="vehChange">↑ 0</div></div>
    </div>

    <!-- 5.1 Grafik: Livrezon pa mwa & Depans transpò -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Livrezon pa mwa</h4></div>
            <div class="chart-container"><canvas id="deliveriesChart"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">💰 Depans transpò pa mwa</h4></div>
            <div class="chart-container"><canvas id="transportCostsChart"></canvas></div>
        </div>
    </div>
</section>
