<!-- views/ventes_crm.html -->
<section id="ventes" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">Ventes & CRM</h2>
        <div style="display:flex; gap:8px;">
            <!-- Bouton ki ap ouvri modal la -->
            <button onclick="openSalesModal()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">➕ Nouvo Vant</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📊 Rapò</button>
        </div>
    </div>

    <!-- KPI yo (Ak ID) -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">🛒 Vant Jodi a</div><div class="value" id="salesToday">0 HTG</div><div class="change up" id="salesTodayChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">📈 Vant Mwa a</div><div class="value" id="salesMonth">0 HTG</div><div class="change up" id="salesMonthChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">👥 Nouvo Kliyan</div><div class="value" id="newClients">0</div><div class="change up" id="newClientsChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">💰 Chif Afè (CA)</div><div class="value" id="totalRevenue">0 HTG</div><div class="change up" id="totalRevenueChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">📋 Devis An Atant</div><div class="value" id="pendingQuotes">0</div><div class="change up" id="pendingQuotesChange">↑ 0</div></div>
    </div>

    <!-- Grafik -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📊 Vant pa Mwa</h4></div>
            <div class="chart-container"><canvas id="salesChartMonthly"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Vant pa Pwodwi</h4></div>
            <div class="chart-container"><canvas id="salesChartProduct"></canvas></div>
        </div>
    </div>

    <!-- ===================== MODAL NOUVO VANT ===================== -->
    <div id="newSaleModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:white; padding:24px; border-radius:16px; max-width:400px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom:16px;">Nouvo Vant</h3>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Kliyan</label>
                    <input type="text" id="saleCustomer" placeholder="Non kliyan an" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Total (HTG)</label>
                    <input type="number" id="saleTotal" placeholder="0" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Dat</label>
                    <input type="date" id="saleDate" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
                    <button onclick="closeSalesModal()" style="padding:8px 16px; border:1px solid #E2E8F0; background:white; border-radius:6px; cursor:pointer;">Anile</button>
                    <button onclick="saveNewSale()" style="padding:8px 16px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Sove</button>
                </div>
            </div>
        </div>
    </div>
    </section>
