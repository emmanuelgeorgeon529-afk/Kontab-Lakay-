<!-- views/rh_paie.html -->
<section id="rh" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:8px;">
        <h2 style="font-size:22px; font-weight:600;">Ressources Humaines & Paie</h2>
        <div style="display:flex; gap:8px;">
            <button onclick="openEmployeeModal()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">➕ Nouvo Anplwaye</button>
            <button style="background:white; border:1px solid #E2E8F0; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">📊 Rapò RH</button>
        </div>
    </div>

    <!-- 6.1 KPI RH -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));">
        <div class="kpi-card"><div class="label">👥 Total Anplwaye</div><div class="value" id="totalEmployees">0</div><div class="change up" id="empChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">🟢 Anplwaye Aktif</div><div class="value" id="activeEmployees">0</div><div class="change up" id="activeChange">↑ 0</div></div>
        <div class="kpi-card"><div class="label">🏖️ Anplwaye an Konje</div><div class="value" id="onLeaveEmployees">0</div><div class="change down" id="leaveChange">↓ 0</div></div>
        <div class="kpi-card"><div class="label">💵 Pewòl Mwa sa</div><div class="value" id="monthlyPayroll">0 HTG</div><div class="change up" id="payrollChange">↑ 0%</div></div>
        <div class="kpi-card"><div class="label">⏰ Lè Siplemantè</div><div class="value" id="totalOvertime">0h</div><div class="change down" id="overTimeChange">↑ 0h</div></div>
    </div>

    <!-- 6.1 Grafik -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">📈 Depans Salè (6 mwa)</h4></div>
            <div class="chart-container"><canvas id="rhSalaryChart"></canvas></div>
        </div>
        <div class="chart-section">
            <div class="chart-header"><h4 style="font-weight:600;">👥 Distribisyon pa Depatman</h4></div>
            <div class="chart-container"><canvas id="rhDeptChart"></canvas></div>
        </div>
    </div>

    <!-- ===================== MODAL NOUVO ANPLWAYE ===================== -->
    <div id="newEmployeeModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:2000; align-items:center; justify-content:center;">
        <div style="background:white; padding:24px; border-radius:16px; max-width:400px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.1);">
            <h3 style="margin-bottom:16px;">Nouvo Anplwaye</h3>
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Non Anplwaye</label>
                    <input type="text" id="empName" placeholder="Egzanp: Jean Dupont" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Imèl</label>
                    <input type="email" id="empEmail" placeholder="jean@konpayi.com" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Depatman</label>
                    <select id="empDept" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                        <option value="Finans">Finans</option>
                        <option value="Vant">Vant</option>
                        <option value="Operasyon">Operasyon</option>
                        <option value="RH">RH</option>
                        <option value="Direksyon">Direksyon</option>
                        <option value="IT">IT</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Pozisyon</label>
                    <input type="text" id="empPosition" placeholder="Egzanp: Comptable" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:13px; color:var(--text-muted);">Salè Baz (HTG)</label>
                    <input type="number" id="empSalary" placeholder="0" style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
                    <button onclick="closeEmployeeModal()" style="padding:8px 16px; border:1px solid #E2E8F0; background:white; border-radius:6px; cursor:pointer;">Anile</button>
                    <button onclick="saveNewEmployee()" style="padding:8px 16px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Anrejistre</button>
                </div>
            </div>
        </div>
    </div>
</section>
