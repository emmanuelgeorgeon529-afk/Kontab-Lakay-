<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KontaPro - Connexion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="assets/css/responsive.css">
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0A5C30,#1B8A4A);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:400px;
background:#fff;
border-radius:25px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
text-align:center;
font-size:60px;
}

h1{
text-align:center;
color:#0A5C30;
margin-top:10px;
}

.slogan{
text-align:center;
font-size:14px;
color:#777;
margin-bottom:25px;
}

.welcome{
font-size:22px;
font-weight:600;
color:#333;
margin-bottom:5px;
}

.subtitle{
font-size:14px;
color:#777;
margin-bottom:20px;
}

label{
display:block;
font-weight:600;
margin-bottom:6px;
margin-top:12px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
font-size:15px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#1B8A4A;
color:white;
border:none;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#0A5C30;
}

.links{
text-align:center;
margin-top:18px;
}

.links a{
display:block;
margin:10px 0;
text-decoration:none;
color:#1B8A4A;
font-weight:600;
}

.fingerprint{
text-align:center;
font-size:45px;
margin-top:15px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">📊</div>

<h1>KONTAPRO</h1>

<p class="slogan">
Gérez mieux, développez plus.
</p>

<div class="welcome">
Bienvenue !
</div>

<div class="subtitle">
Connectez-vous à votre compte
</div>

<label>📧 Adresse e-mail</label>
<input type="email" placeholder="nom@email.com">

<label>🔒 Mot de passe</label>
<input type="password" placeholder="********">

<button>Se connecter</button>

<div class="fingerprint">
👆
</div>

<div class="links">
<a href="#">Mot de passe oublié ?</a>

<hr style="margin:15px 0;">

<a href="#">Créer un compte</a>

</div>

</div>

</body>
</html>
