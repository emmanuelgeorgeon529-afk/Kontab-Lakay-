<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KontaPro | Connexion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<link rel="stylesheet" href="assets/css/responsive.css">

</head>

<body>

<div class="login-container">

<div class="login-card">

<div class="logo">

<div class="logo-circle">
📊
</div>

<h1>KONTAPRO</h1>

<p class="slogan">
Gérez mieux, développez plus.
</p>

</div>

<div class="welcome">

<h2>Bienvenue !</h2>

<p>Connectez-vous à votre compte</p>

</div>

<form id="loginForm">

<div class="form-group">

<label for="email">
📧 Adresse e-mail
</label>

<input
type="email"
id="email"
name="email"
placeholder="nom@gmail.com"
required>

</div>

<div class="form-group">

<label for="password">
🔒 Mot de passe
</label>

<div class="password-box">

<input
type="password"
id="password"
name="password"
placeholder="********"
required>

<button
type="button"
id="togglePassword">
👁
</button>

</div>

</div>

<div class="remember-row">

<label>

<input
type="checkbox"
id="rememberMe">

Se souvenir de moi

</label>

</div>

<button
type="submit"
class="btn-login">

Se connecter

</button>

<div
class="fingerprint"
id="fingerprintLogin">

👆 Connexion par empreinte

</div>

<div class="links">

<a
href="#"
id="forgotPassword">

Mot de passe oublié ?

</a>

<div class="separator">

<span>ou</span>

</div>

<a href="register.html">

Créer un compte

</a>

</div>

</form>

</div>

</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>

</body>

</html>
