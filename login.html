<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KontaPro | Connexion</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#0A5C30,#1B8A4A);

display:flex;

justify-content:center;

align-items:center;

height:100vh;

padding:20px;

}

.container{

width:100%;

max-width:420px;

background:#fff;

border-radius:25px;

padding:35px;

box-shadow:0 20px 60px rgba(0,0,0,.25);

animation:fade .6s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

text-align:center;

margin-bottom:25px;

}

.logo img{

width:90px;

margin-bottom:10px;

}

.logo h1{

font-size:32px;

color:#0A5C30;

font-weight:700;

}

.logo p{

font-size:14px;

color:#777;

}

.title{

font-size:22px;

font-weight:600;

margin-bottom:20px;

text-align:center;

color:#333;

}

.input-group{

margin-bottom:18px;

}

.input-group label{

display:block;

margin-bottom:6px;

font-weight:500;

color:#444;

}

.input-group input{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:12px;

outline:none;

font-size:15px;

transition:.3s;

}

.input-group input:focus{

border-color:#1B8A4A;

box-shadow:0 0 8px rgba(27,138,74,.3);

}

.password-box{

position:relative;

}

.password-box span{

position:absolute;

right:15px;

top:15px;

cursor:pointer;

font-size:18px;

}

.options{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

font-size:14px;

}

.options a{

text-decoration:none;

color:#1B8A4A;

font-weight:600;

}

.btn{

width:100%;

padding:15px;

background:#1B8A4A;

border:none;

color:white;

border-radius:15px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.btn:hover{

background:#0A5C30;

transform:scale(1.02);

}

.bottom{

margin-top:20px;

text-align:center;

font-size:14px;

}

.bottom a{

text-decoration:none;

color:#1B8A4A;

font-weight:600;

}

.toast{

position:fixed;

bottom:20px;

left:50%;

transform:translateX(-50%);

background:#333;

color:white;

padding:15px 20px;

border-radius:10px;

display:none;

z-index:9999;

}

.loader{

display:none;

margin:15px auto;

width:35px;

height:35px;

border:4px solid #ddd;

border-top:4px solid #1B8A4A;

border-radius:50%;

animation:spin .8s linear infinite;

}

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="assets/logo.png">

<h1>KontaPro</h1>

<p>Système intelligent de gestion</p>

</div>

<div class="title">

Connexion

</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="exemple@email.com">

</div>

<div class="input-group">

<label>Mot de passe</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="********">

<span onclick="togglePassword()">👁</span>

</div>

</div>
