<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KontaPro Login</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0A5C30,#1B8A4A);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:25px;
border-radius:20px;
width:90%;
max-width:360px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#1B8A4A;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:8px;
}

button:hover{
background:#0A5C30;
}

.small{
font-size:13px;
color:#1B8A4A;
cursor:pointer;
margin-top:10px;
}

.eye{
position:absolute;
right:15px;
top:12px;
cursor:pointer;
}

.pass-box{
position:relative;
}

.fingerprint{
margin-top:15px;
font-size:40px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="card">

<h2>🏠 KontaPro</h2>
<p>Konekte sou kont ou</p>

<input id="email" type="email" placeholder="Email">

<div class="pass-box">
<input id="password" type="password" placeholder="Mot de passe">
<span class="eye" onclick="toggle()">👁</span>
</div>

<button onclick="login()">Connexion</button>

<div class="small" onclick="forgot()">
Mot de passe oublié ?
</div>

<div class="fingerprint" onclick="fingerLogin()">
👆
</div>

<p style="font-size:12px;color:#666;">Login ak empreinte</p>

</div>

<script>

function toggle(){
let p = document.getElementById("password");
p.type = p.type === "password" ? "text" : "password";
}

function login(){
let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

if(!email || !pass){
alert("Ranpli tout chan yo!");
return;
}

localStorage.setItem("user", email);
alert("Koneksyon reyisi!");
window.location.href = "index.html";
}

function forgot(){
let email = prompt("Antre email ou pou reset modpas:");
if(email){
alert("Nou voye yon lyen reset pou: " + email);
}
}

function fingerLogin(){
let ok = confirm("Sèvi ak empreinte pou konekte?");
if(ok){
localStorage.setItem("user", "finger-user");
alert("Empreinte verifye!");
window.location.href = "index.html";
}
}

</script>

</body>
</html>
