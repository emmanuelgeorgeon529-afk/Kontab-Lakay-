<!-- Nan fen login.html, ranplase de liy script ou yo ak sa a -->
<script type="module">
    import { loginUser, checkActiveSession } from './assets/js/auth.js';

    // 1. Tcheke si moun lan te deja konekte pou n redirije l
    checkActiveSession();

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const loginBtn = document.querySelector('.btn-login');
    const togglePasswordBtn = document.getElementById('togglePassword');

    // 2. Jere "Remember Me" nan demaraj paj la
    const savedEmail = localStorage.getItem('kontapro_remembered_email');
    if (savedEmail) {
        emailInput.value = savedEmail;
        rememberMeCheckbox.checked = true;
    }

    // 3. Koute lè fòm lan soumèt
    loginForm.addEventListener('submit', (e) => {
        e.preventDefault(); // Anpeche paj la rechaje
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const rememberMe = rememberMeCheckbox.checked;

        // Deklanche lojik koneksyon Firebase la
        loginUser(email, password, rememberMe, loginBtn);
    });

    // 4. Fonksyonalite pou afiche/kache modpas (👁)
    togglePasswordBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            togglePasswordBtn.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            togglePasswordBtn.textContent = '👁';
        }
    });
</script>
