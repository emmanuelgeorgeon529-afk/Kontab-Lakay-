<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontab Lakay - Tableau de Bord</title>
    <!-- Assets CSS -->
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/theme-light.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- SIDEBAR (chargé depuis le composant) -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        
        <!-- TOPBAR (chargé depuis le composant) -->
        <div id="topbar-container"></div>

        <!-- VIEWS CONTAINER (chargé depuis les vues) -->
        <div class="view-container" id="view-container">
            <!-- La vue Dashboard sera chargée ici par défaut -->
            <div id="dashboard-view"></div>
            <!-- Les autres vues seront injectées dynamiquement par le routeur -->
        </div>

    </main>

    <!-- Core JS -->
    <script src="js/core/router.js"></script>
    <script src="js/core/app.js"></script>

    <script>
        // Chargement des composants HTML (Simule un système de templates)
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Charger la Sidebar
            const sidebarRes = await fetch('components/layout/sidebar.html');
            document.getElementById('sidebar-container').innerHTML = await sidebarRes.text();

            // 2. Charger la Topbar
            const topbarRes = await fetch('components/layout/topbar.html');
            document.getElementById('topbar-container').innerHTML = await topbarRes.text();

            // 3. Charger le Dashboard par défaut
            const dashboardRes = await fetch('views/dashboard.html');
            document.getElementById('dashboard-view').innerHTML = await dashboardRes.text();

            // 4. Initialiser le Routeur
            initRouter();
        });
    </script>
</body>
</html>
